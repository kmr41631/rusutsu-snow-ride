<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>RUSUTSU SNOW RIDE</title>

<style>

*{

  box-sizing:border-box;

  -webkit-user-select:none;

  user-select:none;

  touch-action:none;

}

html,body{

  margin:0;

  width:100%;

  height:100%;

  overflow:hidden;

  font-family:-apple-system,BlinkMacSystemFont,

  "Helvetica Neue",Arial,sans-serif;

  background:#8fc9ee;

}

#game{

  position:relative;

  width:100vw;

  height:100vh;

  overflow:hidden;

  background:

    linear-gradient(

      #72b8df 0%,

      #bde4f5 42%,

      #eef8fb 100%

    );

}

/* 空 */

#sky{

  position:absolute;

  inset:0;

  background:

    radial-gradient(circle at 78% 13%,

    rgba(255,255,255,.85) 0 28px,

    transparent 29px),

    linear-gradient(#73b9e2,#e8f7fc);

}

/* 山 */

.mountain{

  position:absolute;

  left:-30%;

  width:160%;

  height:45%;

  bottom:48%;

  background:#66899a;

  clip-path:polygon(

    0 100%,

    15% 65%,

    27% 78%,

    43% 28%,

    55% 67%,

    70% 15%,

    82% 62%,

    100% 35%,

    100% 100%

  );

  opacity:.8;

}

.mountain.snow{

  background:#eef7fa;

  height:42%;

  bottom:49%;

  opacity:.8;

  clip-path:polygon(

    0 100%,

    15% 70%,

    27% 81%,

    43% 34%,

    55% 70%,

    70% 22%,

    82% 66%,

    100% 42%,

    100% 100%

  );

}

/* コース */

#course{

  position:absolute;

  left:50%;

  top:-15%;

  width:76%;

  height:135%;

  transform:translateX(-50%);

  background:#fff;

  clip-path:polygon(

    40% 0,

    60% 0,

    67% 13%,

    55% 27%,

    72% 43%,

    57% 58%,

    70% 76%,

    55% 100%,

    45% 100%,

    30% 76%,

    43% 58%,

    28% 43%,

    45% 27%,

    33% 13%

  );

  box-shadow:

    0 0 30px rgba(255,255,255,.8);

}

/* コースの影 */

#course:after{

  content:"";

  position:absolute;

  inset:0;

  background:

    repeating-linear-gradient(

      105deg,

      transparent 0,

      transparent 90px,

      rgba(120,170,190,.12) 92px,

      transparent 95px

    );

}

/* 木 */

.tree{

  position:absolute;

  width:0;

  height:0;

  border-left:24px solid transparent;

  border-right:24px solid transparent;

  border-bottom:90px solid #285247;

  z-index:5;

}

.tree:after{

  content:"";

  position:absolute;

  left:-19px;

  top:38px;

  border-left:19px solid transparent;

  border-right:19px solid transparent;

  border-bottom:70px solid #23483f;

}

.tree.a{

  left:4%;

  bottom:32%;

  transform:scale(.8);

}

.tree.b{

  right:4%;

  bottom:40%;

  transform:scale(.65);

}

.tree.c{

  left:14%;

  bottom:53%;

  transform:scale(.48);

}

.tree.d{

  right:14%;

  bottom:57%;

  transform:scale(.5);

}

.tree.e{

  left:2%;

  bottom:67%;

  transform:scale(.38);

}

.tree.f{

  right:3%;

  bottom:70%;

  transform:scale(.42);

}

/* HUD */

#hud{

  position:absolute;

  top:14px;

  left:12px;

  right:12px;

  z-index:50;

  display:flex;

  gap:8px;

}

.hudBox{

  flex:1;

  min-width:0;

  background:rgba(10,20,28,.72);

  color:white;

  padding:10px 8px;

  border-radius:14px;

  text-align:center;

  font-size:12px;

  font-weight:bold;

  backdrop-filter:blur(8px);

}

.hudValue{

  display:block;

  margin-top:3px;

  font-size:18px;

}

/* 進行バー */

#progress{

  position:absolute;

  top:76px;

  left:18px;

  right:18px;

  height:7px;

  background:rgba(0,0,0,.25);

  border-radius:10px;

  z-index:50;

  overflow:hidden;

}

#bar{

  width:0%;

  height:100%;

  background:white;

  border-radius:10px;

}

/* プレイヤー */

#player{

  position:absolute;

  left:50%;

  bottom:18%;

  z-index:30;

  font-size:58px;

  transform:translateX(-50%);

  transition:

    left .18s ease,

    transform .15s ease;

  filter:drop-shadow(0 8px 5px rgba(0,0,0,.25));

}

/* 障害物 */

.obstacle{

  position:absolute;

  z-index:25;

  font-size:44px;

  transition:

    top .1s linear,

    transform .15s;

}

/* スピード線 */

.speedLine{

  position:absolute;

  width:3px;

  height:60px;

  background:rgba(255,255,255,.65);

  z-index:15;

  border-radius:5px;

  animation:fall .5s linear forwards;

}

@keyframes fall{

  from{

    transform:translateY(-100px);

    opacity:0;

  }

  30%{opacity:1}

  to{

    transform:translateY(100vh);

    opacity:0;

  }

}

/* 操作ボタン */

#controls{

  position:absolute;

  left:0;

  right:0;

  bottom:24px;

  z-index:60;

  display:flex;

  justify-content:space-between;

  padding:0 25px;

}

.turn{

  width:78px;

  height:78px;

  border-radius:50%;

  border:2px solid rgba(255,255,255,.8);

  background:rgba(0,0,0,.55);

  color:white;

  font-size:38px;

  font-weight:bold;

  box-shadow:0 5px 15px rgba(0,0,0,.25);

}

.turn:active{

  transform:scale(.92);

  background:rgba(255,255,255,.3);

}

/* スタート画面 */

.overlay{

  position:absolute;

  inset:0;

  z-index:100;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  color:white;

  padding:25px;

  background:

    linear-gradient(

      rgba(5,15,22,.55),

      rgba(5,15,22,.82)

    );

  backdrop-filter:blur(3px);

}

.title{

  font-size:38px;

  line-height:1.05;

  font-weight:900;

  letter-spacing:1px;

  margin-bottom:10px;

  text-shadow:0 4px 15px rgba(0,0,0,.4);

}

.subtitle{

  font-size:22px;

  font-weight:bold;

  margin-bottom:25px;

}

.description{

  font-size:16px;

  line-height:1.8;

}

.stats{

  margin-top:15px;

  font-size:17px;

  line-height:1.8;

}

.startButton{

  margin-top:28px;

  padding:16px 60px;

  border:0;

  border-radius:40px;

  background:white;

  color:#111;

  font-size:21px;

  font-weight:900;

  box-shadow:

    0 8px 25px rgba(0,0,0,.35);

}

.startButton:active{

  transform:scale(.95);

}

/* ゴール */

#finish{

  display:none;

}

.resultTitle{

  font-size:42px;

  font-weight:900;

  margin-bottom:10px;

}

.result{

  font-size:20px;

  line-height:2;

}

.rank{

  font-size:30px;

  font-weight:bold;

  margin:10px;

}

/* カウントダウン */

#countdown{

  position:absolute;

  inset:0;

  z-index:90;

  display:none;

  align-items:center;

  justify-content:center;

  color:white;

  font-size:100px;

  font-weight:900;

  text-shadow:0 5px 20px rgba(0,0,0,.5);

}

</style>

</head>

<body>

<div id="game">

  <div id="sky"></div>

  <div class="mountain"></div>

  <div class="mountain snow"></div>

  <div id="course"></div>

  <div class="tree a"></div>

  <div class="tree b"></div>

  <div class="tree c"></div>

  <div class="tree d"></div>

  <div class="tree e"></div>

  <div class="tree f"></div>

  <div id="hud">

    <div class="hudBox">

      COURSE

      <span class="hudValue">ISOLA GRAND</span>

    </div>

    <div class="hudBox">

      DISTANCE

      <span class="hudValue">

        <span id="distance">3500</span>m

      </span>

    </div>

    <div class="hudBox">

      SPEED

      <span class="hudValue">

        <span id="speed">0</span> km/h

      </span>

    </div>

  </div>

  <div id="progress">

    <div id="bar"></div>

  </div>

  <div id="player">🏂</div>

  <div id="controls">

    <button class="turn" id="left">

      ←

    </button>

    <button class="turn" id="right">

      →

    </button>

  </div>

  <div id="countdown">

    3

  </div>

  <!-- START -->

  <div id="start" class="overlay">

    <div class="title">

      RUSUTSU<br>

      SNOW RIDE

    </div>

    <div class="subtitle">

      ISOLA GRAND

    </div>

    <div class="description">

      ルスツ・イゾラグランドを滑ろう！

      <br>

      左右にターンしてゴールを目指せ！

    </div>

    <div class="stats">

      📏 約3,500m<br>

      📐 平均12°<br>

      🔥 最大20°<br>

      ⭐ 中級

    </div>

    <button

      class="startButton"

      onclick="startGame()">

      START

    </button>

  </div>

  <!-- FINISH -->

  <div id="finish" class="overlay">

    <div class="resultTitle">

      🏁 FINISH!

    </div>

    <div class="subtitle">

      ISOLA GRAND

    </div>

    <div class="result">

      タイム

      <br>

      <strong id="finalTime">0.0</strong> 秒

      <br>

      スコア

      <br>

      <strong id="finalScore">0</strong>

    </div>

    <div class="rank" id="rank">

      🏂 GOOD RIDE!

    </div>

    <button

      class="startButton"

      onclick="location.reload()">

      もう一度滑る

    </button>

  </div>

</div>

<script>

let distance = 3500;

let speed = 0;

let playerX = 50;

let gameRunning = false;

let startTime = 0;

let score = 0;

let gameTimer;

let obstacleTimer;

const player =

document.getElementById("player");

const distanceText =

document.getElementById("distance");

const speedText =

document.getElementById("speed");

const bar =

document.getElementById("bar");

const countdown =

document.getElementById("countdown");

/* START */

function startGame(){

  document.getElementById("start")

  .style.display="none";

  countdown.style.display="flex";

  let count=3;

  countdown.textContent=count;

  const cd=setInterval(()=>{

    count--;

    if(count>0){

      countdown.textContent=count;

    }else{

      clearInterval(cd);

      countdown.style.display="none";

      beginRide();

    }

  },700);

}

/* 滑走開始 */

function beginRide(){

  gameRunning=true;

  startTime=Date.now();

  speed=28;

  gameTimer=setInterval(updateGame,100);

  obstacleTimer=setInterval(createObstacle,850);

  createSpeedLines();

}

/* ゲーム更新 */

function updateGame(){

  if(!gameRunning)return;

  distance -= speed * 0.1;

  if(distance<0){

    distance=0;

  }

  /* 少しずつ加速 */

  if(speed<55){

    speed += 0.035;

  }

  distanceText.textContent=

  Math.floor(distance);

  speedText.textContent=

  Math.floor(speed);

  const progress=

  ((3500-distance)/3500)*100;

  bar.style.width=

  progress+"%";

  if(distance<=0){

    finishGame();

  }

}

/* 左右ターン */

function turn(direction){

  if(!gameRunning)return;

  playerX += direction * 8;

  if(playerX<24){

    playerX=24;

  }

  if(playerX>76){

    playerX=76;

  }

  player.style.left=

  playerX+"%";

  player.style.transform=

  "translateX(-50%) rotate("+

  (direction*18)+"deg)";

  score += 15;

  setTimeout(()=>{

    player.style.transform=

    "translateX(-50%) rotate(0deg)";

  },160);

}

/* ボタン */

document

.getElementById("left")

.addEventListener("touchstart",e=>{

  e.preventDefault();

  turn(-1);

});

document

.getElementById("right")

.addEventListener("touchstart",e=>{

  e.preventDefault();

  turn(1);

});

document

.getElementById("left")

.addEventListener("click",()=>turn(-1));

document

.getElementById("right")

.addEventListener("click",()=>turn(1));

/* スワイプ操作 */

let touchX=0;

document.addEventListener(

"touchstart",

e=>{

  touchX=

  e.touches[0].clientX;

});

document.addEventListener(

"touchend",

e=>{

  if(!gameRunning)return;

  const endX=

  e.changedTouches[0].clientX;

  const diff=

  endX-touchX;

  if(Math.abs(diff)>35){

    if(diff>0){

      turn(1);

    }else{

      turn(-1);

    }

  }

});

/* 障害物 */

function createObstacle(){

  if(!gameRunning)return;

  const obstacle=

  document.createElement("div");

  obstacle.className="obstacle";

  obstacle.textContent=

  Math.random()>.5 ? "🌲" : "⛷️";

  let x=

  25+Math.random()*50;

  obstacle.style.left=

  x+"%";

  obstacle.style.top="-80px";

  document

  .getElementById("game")

  .appendChild(obstacle);

  let y=-80;

  const fall=

  setInterval(()=>{

    if(!gameRunning){

      clearInterval(fall);

      obstacle.remove();

      return;

    }

    y+=speed*.7;

    obstacle.style.top=

    y+"px";

    const playerRect=

    player.getBoundingClientRect();

    const obstacleRect=

    obstacle.getBoundingClientRect();

    if(

      playerRect.left <

      obstacleRect.right &&

      playerRect.right >

      obstacleRect.left &&

      playerRect.top <

      obstacleRect.bottom &&

      playerRect.bottom >

      obstacleRect.top

    ){

      score-=50;

      if(score<0)score=0;

      obstacle.remove();

      clearInterval(fall);

    }

    if(y>window.innerHeight){

      clearInterval(fall);

      obstacle.remove();

      score+=10;

    }

  },30);

}

/* スピード線 */

function createSpeedLines(){

  if(!gameRunning)return;

  const line=

  document.createElement("div");

  line.className="speedLine";

  line.style.left=

  Math.random()*100+"%";

  line.style.top=

  Math.random()*40+"%";

  document

  .getElementById("game")

  .appendChild(line);

  setTimeout(()=>{

    line.remove();

  },500);

  setTimeout(createSpeedLines,120);

}

/* ゴール */

function finishGame(){

  if(!gameRunning)return;

  gameRunning=false;

  clearInterval(gameTimer);

  clearInterval(obstacleTimer);

  const time=

  ((Date.now()-startTime)/1000)

  .toFixed(1);

  const finalScore=

  Math.max(0,

  Math.floor(score+(3500/time)));

  document

  .getElementById("finalTime")

  .textContent=time;

  document

  .getElementById("finalScore")

  .textContent=finalScore;

  let rank;

  if(finalScore>=1000){

    rank="🏆 PERFECT RIDE!";

  }else if(finalScore>=700){

    rank="🥇 GREAT RIDE!";

  }else if(finalScore>=400){

    rank="🥈 NICE RIDE!";

  }else{

    rank="🏂 GOOD RIDE!";

  }

  document

  .getElementById("rank")

  .textContent=rank;

  document

  .getElementById("finish")

  .style.display="flex";

}

</script>

</body>

</html>
